<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1d2433; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .card { border: 1px solid #dde1e8; border-radius: 10px; padding: 12px; text-align: center; }
  .card img { width: 80px; height: 80px; border-radius: 50%; background: #eef0f4; }
  .card h3 { font-size: 1rem; margin: .5rem 0 .2rem; }
  .card p { margin: 0; font-size: .8rem; color: #5a6475; word-break: break-all; }
  #pagination { display: flex; justify-content: center; gap: 8px; margin: 24px 0; flex-wrap: wrap; }
  #pagination button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #2f6fed; background: #fff; color: #2f6fed; cursor: pointer; }
  #pagination button.active { background: #2f6fed; color: #fff; }
  #pagination button:focus-visible { outline: 3px solid #1d2433; outline-offset: 2px; }
</style>
</head>
<body>
  <h1>Users</h1>
  <div id="list"></div>
  <div id="pagination"></div>

  <script>
    const list = document.querySelector("#list")
    const pageination = document.querySelector("#pagination")
    let page = 1
    const limit = 10
    let totalpage = 1
    let alldata = []

    async function getdata(){
      try{
        const response = await fetch("https://dummyjson.com/products?limit=100")
        if(!response.ok){
          throw new Error("error" + response.status)
        }
        const data = await response.json()
        alldata = data.products
        totalpage = Math.ceil(alldata.length / limit)
        showpage(1)
      }
      catch(error){
        console.error(error)
        list.textContent = "w93 mochkil"
      }
    }

    function showpage(p){
      page = p
      const start = (p - 1) * limit
      const items = alldata.slice(start, start + limit)
      render(items)
      renderButton()
    }

    function render(items){
      list.innerHTML = items.map(items => `<div><h3>${items.title}</h3>
        <p>${items.price}</p></div>`)
      .join("")
    }

    function renderButton(){
      pageination.innerHTML = ""
      for(let i = 1; i < totalpage; i++){
        const btn = document.createElement("button")
        btn.textContent = i
        if(i === page){
          btn.classList.add("active")
        }
        btn.addEventListener("click", () => showpage(i))
        pageination.appendChild(btn)
      }
    }

    getdata()
  </script>
</body>
</html>
