<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A beginner-friendly product pagination example using JavaScript and DummyJSON.">
  <title>Product Pagination</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d2433;
      background: #f6f8fb;
    }

    * { box-sizing: border-box; }

    body { margin: 0; padding: 32px 16px; }
    main { width: min(900px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 8px; }
    .intro, #status, .page-info { color: #5a6475; }
    #status { min-height: 1.5em; margin: 20px 0; }

    #list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border: 1px solid #dde1e8;
      border-radius: 12px;
      background: #fff;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      border-radius: 8px;
      background: #eef0f4;
    }

    .card h2 { margin: 0; font-size: 1rem; }
    .price { margin: auto 0 0; color: #2f6fed; font-weight: 700; }

    #pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 24px 0 12px;
      flex-wrap: wrap;
    }

    #pagination button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #2f6fed;
      border-radius: 999px;
      background: #fff;
      color: #2f6fed;
      cursor: pointer;
      font: inherit;
    }

    #pagination button:hover:not(:disabled) { background: #edf3ff; }
    #pagination button.active { background: #2f6fed; color: #fff; }
    #pagination button:disabled { cursor: not-allowed; opacity: .45; }
    #pagination button:focus-visible { outline: 3px solid #1d2433; outline-offset: 3px; }
    .page-info { text-align: center; font-size: .9rem; }

    @media (max-width: 520px) {
      body { padding: 24px 12px; }
      #list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .card { padding: 10px; }
      .card img { height: 110px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Products</h1>
    <p class="intro">A small example of client-side pagination with JavaScript.</p>
    <p id="status" role="status" aria-live="polite">Loading products…</p>
    <section id="list" aria-label="Products"></section>
    <nav id="pagination" aria-label="Product pages"></nav>
    <p id="page-info" class="page-info"></p>
  </main>

  <script>
    const productList = document.querySelector("#list");
    const pagination = document.querySelector("#pagination");
    const statusMessage = document.querySelector("#status");
    const pageInfo = document.querySelector("#page-info");

    let currentPage = 1;
    const pageSize = 10;
    let totalPages = 1;
    let allProducts = [];

    async function loadProducts() {
      try {
        const response = await fetch("https://dummyjson.com/products?limit=0");

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const data = await response.json();
        allProducts = data.products;
        totalPages = Math.ceil(allProducts.length / pageSize);
        statusMessage.textContent = "";
        showPage(1);
      } catch (error) {
        console.error("Could not load products:", error);
        statusMessage.textContent = "Products could not be loaded. Check your internet connection and try again.";
        productList.replaceChildren();
        pagination.replaceChildren();
        pageInfo.textContent = "";
      }
    }

    function showPage(pageNumber) {
      if (allProducts.length === 0) return;

      currentPage = Math.min(Math.max(pageNumber, 1), totalPages);
      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = startIndex + pageSize;
      const productsForPage = allProducts.slice(startIndex, endIndex);

      renderProducts(productsForPage);
      renderPagination();

      pageInfo.textContent = `Showing ${startIndex + 1}–${startIndex + productsForPage.length} of ${allProducts.length} products`;
    }

    function renderProducts(products) {
      const cards = products.map((product) => {
        const card = document.createElement("article");
        card.className = "card";

        const image = document.createElement("img");
        image.src = product.thumbnail;
        image.alt = product.title;
        image.loading = "lazy";

        const title = document.createElement("h2");
        title.textContent = product.title;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = `$${product.price.toFixed(2)}`;

        card.append(image, title, price);
        return card;
      });

      productList.replaceChildren(...cards);
    }

    function renderPagination() {
      pagination.replaceChildren();

      const buttons = [];

      const previousButton = createButton("Previous", currentPage - 1, currentPage === 1);
      buttons.push(previousButton);

      for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
        const button = createButton(String(pageNumber), pageNumber);
        button.setAttribute("aria-label", `Page ${pageNumber}`);

        if (pageNumber === currentPage) {
          button.classList.add("active");
          button.setAttribute("aria-current", "page");
        }

        buttons.push(button);
      }

      const nextButton = createButton("Next", currentPage + 1, currentPage === totalPages);
      buttons.push(nextButton);
      pagination.replaceChildren(...buttons);
    }

    function createButton(label, targetPage, disabled = false) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.disabled = disabled;
      button.addEventListener("click", () => showPage(targetPage));
      return button;
    }

    loadProducts();
  </script>
</body>
</html>
